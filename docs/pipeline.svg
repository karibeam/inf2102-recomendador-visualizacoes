<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .painel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .rotulo { fill: #64748b; font-size: 13px; letter-spacing: .6px; }
      .caixa  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .llm    { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .titulo { fill: #0f172a; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .sub    { fill: #64748b; font-size: 12px; text-anchor: middle; }
      .seta   { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#seta); }
      .mono   { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; fill: #0f172a; }
      .nota   { fill: #64748b; font-size: 12px; }
    </style>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>

  <!-- ETAPA OFFLINE -->
  <rect class="painel" x="30" y="30" width="900" height="170" rx="12"/>
  <text class="rotulo" x="48" y="56">ETAPA OFFLINE · roda uma vez · src/indexar.py</text>

  <rect class="caixa" x="48" y="80" width="150" height="80" rx="8"/>
  <text class="titulo" x="123" y="113">59 artigos</text>
  <text class="sub" x="123" y="133">JSON, base intacta</text>

  <rect class="caixa" x="220" y="80" width="150" height="80" rx="8"/>
  <text class="titulo" x="295" y="113">240 achados</text>
  <text class="sub" x="295" y="133">1 achado = 1 documento</text>

  <rect class="caixa" x="392" y="80" width="150" height="80" rx="8"/>
  <text class="titulo" x="467" y="113">Template fixo</text>
  <text class="sub" x="467" y="133">sem LLM</text>

  <rect class="caixa" x="564" y="80" width="150" height="80" rx="8"/>
  <text class="titulo" x="639" y="113">Embeddings</text>
  <text class="sub" x="639" y="133">gemini-embedding-001</text>

  <path class="caixa" d="M 736 92 a 75 12 0 0 1 150 0 v 56 a 75 12 0 0 1 -150 0 z"/>
  <path d="M 736 92 a 75 12 0 0 0 150 0" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="titulo" x="811" y="122">Chroma</text>
  <text class="sub" x="811" y="141">banco vetorial</text>

  <path class="seta" d="M 202 120 H 216"/>
  <path class="seta" d="M 374 120 H 388"/>
  <path class="seta" d="M 546 120 H 560"/>
  <path class="seta" d="M 718 120 H 732"/>

  <!-- ETAPA ONLINE -->
  <rect class="painel" x="30" y="225" width="900" height="368" rx="12"/>
  <text class="rotulo" x="48" y="251">ETAPA ONLINE · a cada pergunta · src/recomendar.py</text>

  <rect class="caixa" x="48" y="275" width="150" height="80" rx="8"/>
  <text class="titulo" x="123" y="308">Pergunta</text>
  <text class="sub" x="123" y="328">linguagem do dia a dia</text>

  <rect class="llm" x="220" y="275" width="150" height="80" rx="8"/>
  <text class="titulo" x="295" y="303">1 · TRADUZIR</text>
  <text class="sub" x="295" y="322">LLM classifica:</text>
  <text class="sub" x="295" y="338">tarefa + tipos de dado</text>

  <rect class="caixa" x="392" y="275" width="150" height="80" rx="8"/>
  <text class="titulo" x="467" y="303">Consulta técnica</text>
  <text class="sub" x="467" y="322">no mesmo formato</text>
  <text class="sub" x="467" y="338">dos documentos</text>

  <rect class="caixa" x="564" y="275" width="150" height="80" rx="8"/>
  <text class="titulo" x="639" y="303">2 · BUSCAR</text>
  <text class="sub" x="639" y="322">similaridade de cosseno</text>
  <text class="sub" x="639" y="338">9 achados mais próximos</text>

  <rect class="llm" x="736" y="275" width="150" height="80" rx="8"/>
  <text class="titulo" x="811" y="303">3 · GERAR</text>
  <text class="sub" x="811" y="322">LLM lê os 9 achados</text>
  <text class="sub" x="811" y="338">e recomenda 1 gráfico</text>

  <path class="seta" d="M 202 315 H 216"/>
  <path class="seta" d="M 374 315 H 388"/>
  <path class="seta" d="M 546 315 H 560"/>
  <path class="seta" d="M 718 315 H 732"/>

  <!-- o banco alimenta a busca -->
  <path class="seta" d="M 811 160 V 190 H 639 V 271"/>

  <!-- recusa e resultado -->
  <path class="seta" d="M 295 359 V 383"/>
  <rect class="caixa" x="200" y="385" width="190" height="46" rx="8"/>
  <text class="sub" x="295" y="404">se não for sobre dados:</text>
  <text class="sub" x="295" y="420">recusa, sem buscar na base</text>

  <path class="seta" d="M 811 359 V 383"/>
  <rect class="caixa" x="480" y="385" width="406" height="46" rx="8"/>
  <text class="sub" x="683" y="404">gráfico + justificativa + artigos citados</text>
  <text class="sub" x="683" y="420">com a especificação Vega-Lite validada</text>

  <!-- exemplo do passo 1 -->
  <text class="rotulo" x="48" y="470">EXEMPLO DO PASSO 1 · o que a tradução muda</text>

  <rect class="caixa" x="48" y="478" width="342" height="86" rx="8"/>
  <text class="mono" x="66" y="506">"quero mostrar a distribuição</text>
  <text class="mono" x="66" y="525">das idades dos meus clientes"</text>
  <text class="nota" x="66" y="548">melhor similaridade: 0,67</text>

  <path class="seta" d="M 396 521 H 474"/>

  <rect class="llm" x="480" y="478" width="406" height="86" rx="8"/>
  <text class="mono" x="498" y="500">task: characterize-distribution</text>
  <text class="mono" x="498" y="518">data types: quantitative</text>
  <text class="mono" x="498" y="536">analysis: show how a quantitative</text>
  <text class="mono" x="498" y="554">variable is distributed</text>

  <text class="nota" x="683" y="583" text-anchor="middle">a mesma busca com a pergunta traduzida: melhor similaridade 0,81</text>
</svg>
